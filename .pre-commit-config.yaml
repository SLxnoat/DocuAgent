# ==============================================================================
# DocuAgent AI — Pre-commit Configuration
# ==============================================================================
default_stages: [pre-commit]
fail_fast: false

repos:
  # ----------------------------------------------------------------------------
  # General File & Security Sanity Checks
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  # ----------------------------------------------------------------------------
  # Python Linting & Formatting (Ruff: Replaces Black, Flake8 & isort)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.5
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      # Formatter
      - id: ruff-format
        files: ^backend/

  # ----------------------------------------------------------------------------
  # Prettier (Formatting for Markdown, JSON, YAML, TypeScript, CSS)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: 'package-lock\.json$'

  # ----------------------------------------------------------------------------
  # Conventional Commits Enforcement (commit-msg hook)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            "feat",
            "fix",
            "docs",
            "style",
            "refactor",
            "perf",
            "test",
            "build",
            "ci",
            "chore",
            "revert",
          ]
