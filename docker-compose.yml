# ==============================================================================
# DocuAgent AI — Production Docker Compose Orchestration
# Defines full stack: Backend, Celery Worker, Frontend, Redis, Nginx Ingress, Flower
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Ingress Reverse Proxy & TLS Terminator
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: docuagent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - docuagent_assets:/app/assets:ro
      - docuagent_exports:/app/exports:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - docuagent-network

  # ----------------------------------------------------------------------------
  # Frontend SPA Web Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuagent-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docuagent-network

  # ----------------------------------------------------------------------------
  # Backend FastAPI Core Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuagent-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - API_TOKEN=${API_TOKEN:-production-secret-token-please-change}
      - ASSETS_DIR=/app/assets
      - EXPORTS_DIR=/app/exports
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://docuagent.local}
    volumes:
      - docuagent_assets:/app/assets
      - docuagent_exports:/app/exports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - docuagent-network

  # ----------------------------------------------------------------------------
  # Celery Distributed Task Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: docuagent-worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - ASSETS_DIR=/app/assets
      - EXPORTS_DIR=/app/exports
    volumes:
      - docuagent_assets:/app/assets
      - docuagent_exports:/app/exports
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docuagent-network

  # ----------------------------------------------------------------------------
  # Redis Cache, Task Queue Broker & PubSub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: docuagent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel notice
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - docuagent-network

  # ----------------------------------------------------------------------------
  # Celery Flower Task Observability Dashboard
  # ----------------------------------------------------------------------------
  flower:
    image: mher/flower:2.0.1
    container_name: docuagent-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docuagent-network

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  redis_data:
    name: docuagent_redis_data
    driver: local
  docuagent_assets:
    name: docuagent_assets_data
    driver: local
  docuagent_exports:
    name: docuagent_exports_data
    driver: local

# ------------------------------------------------------------------------------
# Bridge Network
# ------------------------------------------------------------------------------
networks:
  docuagent-network:
    name: docuagent-network
    driver: bridge
